name: qublox-sales-dev
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: qublox_sales
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run bun run setup first}
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - postgres_dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qublox_sales"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_dev:
