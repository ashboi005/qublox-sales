name: qublox-sales

x-server-env: &server-env
  NODE_ENV: production
  PORT: 3000
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env to your PostgreSQL connection URL}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
  BETTER_AUTH_URL: ${APP_ORIGIN:?Set APP_ORIGIN in .env}
  CORS_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN in .env}
  LLM_PROVIDER: ${LLM_PROVIDER:-groq}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_ROTATE: ${LLM_ROTATE:-true}
  GROQ_RPM: ${GROQ_RPM:-20}
  GROQ_RPD: ${GROQ_RPD:-800}
  GROQ_TPM: ${GROQ_TPM:-8000}
  GROQ_TPD: ${GROQ_TPD:-180000}
  GEMINI_RPM: ${GEMINI_RPM:-10}
  GEMINI_RPD: ${GEMINI_RPD:-250}
  GEMINI_TPM: ${GEMINI_TPM:-200000}
  GEMINI_TPD: ${GEMINI_TPD:-2000000}
  LLM_MONTHLY_BUDGET_USD: ${LLM_MONTHLY_BUDGET_USD:-1}
  GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
  PLACES_MONTHLY_REQUEST_LIMIT: ${PLACES_MONTHLY_REQUEST_LIMIT:-900}
  PAGESPEED_API_KEY: ${PAGESPEED_API_KEY:-}
  PAGE_READER_FALLBACK: ${PAGE_READER_FALLBACK:-true}
  JINA_API_KEY: ${JINA_API_KEY:-}
  FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
  FIRECRAWL_MONTHLY_LIMIT: ${FIRECRAWL_MONTHLY_LIMIT:-900}
  REOON_API_KEY: ${REOON_API_KEY:-}
  REOON_MONTHLY_LIMIT: ${REOON_MONTHLY_LIMIT:-500}
  AUTO_PIPELINE: ${AUTO_PIPELINE:-true}
  DAILY_CONTACT_LIMIT: ${DAILY_CONTACT_LIMIT:-10}
  EMAIL_SENDING_ENABLED: ${EMAIL_SENDING_ENABLED:-false}
  COMPANY_NAME: ${COMPANY_NAME:-Qublox}
  EMAIL_MIN_INTERVAL_SECONDS: ${EMAIL_MIN_INTERVAL_SECONDS:-120}
  EMAIL_ACCOUNT_INTERVAL_SECONDS: ${EMAIL_ACCOUNT_INTERVAL_SECONDS:-600}

services:
  migrate:
    image: qublox-sales-server:local
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    working_dir: /app
    command: [bun, run, db:migrate]
    environment: *server-env
    restart: "no"

  server:
    image: qublox-sales-server:local
    init: true
    environment: *server-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          CMD,
          bun,
          -e,
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    image: qublox-sales-server:local
    init: true
    command: [bun, dist/worker.mjs]
    environment: *server-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 60s
    restart: unless-stopped

  web:
    image: qublox-sales-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    init: true
    ports:
      - "127.0.0.1:${WEB_PORT:-3001}:3001"
    environment:
      # Pinned so a platform-wide PORT (Coolify, the shared .env) cannot move the web app
      # off 3001, where the domain, the published port and the healthcheck all point.
      PORT: 3001
      HOSTNAME: 0.0.0.0
      SERVER_URL: http://server:3000
      NEXT_PUBLIC_SERVER_URL: ${APP_ORIGIN:?Set APP_ORIGIN in .env}
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3001/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  backup:
    profiles: [ops]
    image: postgres:18
    environment:
      PGDATABASE: ${DATABASE_URL:?Set DATABASE_URL in .env}
    entrypoint: [pg_dump]
    command: [--format=custom, --no-owner]
